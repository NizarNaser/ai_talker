<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>لوحة التحكم - AI Talker</title>
    <link rel="icon" href="assets/favicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { font-family: 'Cairo', sans-serif; padding: 30px 20px; max-width: 1100px; margin: 0 auto; }
        .admin-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--border-radius); padding: 24px; margin-bottom: 24px; box-shadow: var(--card-shadow); }
        .admin-title { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .admin-title h2 { margin: 0; font-size: 1.3rem; }
        table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
        th, td { padding: 10px 8px; text-align: right; border-bottom: 1px solid var(--glass-border); vertical-align: top; }
        th { color: var(--text-muted); font-weight: 600; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.8rem; }
        .badge-yes { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge-no { background: rgba(239,68,68,0.15); color: #ef4444; }
        .btn { cursor: pointer; border: none; border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; margin-left: 4px; font-family: inherit; }
        .btn-approve { background: rgba(34,197,94,0.15); color: #22c55e; }
        .btn-reject { background: rgba(234,179,8,0.15); color: #eab308; }
        .btn-delete { background: rgba(239,68,68,0.15); color: #ef4444; }
        #login-screen { max-width: 380px; margin: 80px auto; text-align: center; }
        #login-screen input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: transparent; color: var(--text-color); }
        #login-screen button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: var(--primary-color); color: #fff; cursor: pointer; font-family: inherit; font-size: 1rem; }
        #login-error { color: #ef4444; margin-top: 10px; min-height: 1.2em; }
        #app { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .logout-btn { background: transparent; border: 1px solid var(--glass-border); color: var(--text-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: inherit; }
        .empty-row td { text-align: center; color: var(--text-muted); padding: 20px; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2><i class="fa-solid fa-lock"></i> لوحة تحكم AI Talker</h2>
        <p style="color: var(--text-muted);">هذه الصفحة لمشرفي الموقع فقط.</p>
        <input type="text" id="login-username" placeholder="البريد الإلكتروني / اسم المستخدم">
        <input type="password" id="login-password" placeholder="كلمة المرور">
        <button id="login-btn">تسجيل الدخول</button>
        <div id="login-error"></div>
    </div>

    <div id="app">
        <div class="top-bar">
            <h1><i class="fa-solid fa-shield-halved"></i> لوحة التحكم</h1>
            <button class="logout-btn" id="logout-btn">تسجيل الخروج</button>
        </div>

        <div class="admin-card">
            <div class="admin-title"><i class="fa-solid fa-comments"></i><h2>التعليقات</h2></div>
            <table>
                <thead><tr><th>المستخدم</th><th>التعليق</th><th>الحالة</th><th>التاريخ</th><th>إجراءات</th></tr></thead>
                <tbody id="comments-body"></tbody>
            </table>
        </div>

        <div class="admin-card">
            <div class="admin-title"><i class="fa-solid fa-users"></i><h2>المستخدمون</h2></div>
            <table>
                <thead><tr><th>#</th><th>اسم المستخدم</th><th>البريد</th><th>عبر Google</th><th>أدمن</th><th>تاريخ التسجيل</th></tr></thead>
                <tbody id="users-body"></tbody>
            </table>
        </div>

        <div class="admin-card">
            <div class="admin-title"><i class="fa-solid fa-language"></i><h2>سجلّ الترجمات (آخر 200)</h2></div>
            <table>
                <thead><tr><th>المستخدم</th><th>من</th><th>إلى</th><th>النص الأصلي</th><th>التاريخ</th><th></th></tr></thead>
                <tbody id="translations-body"></tbody>
            </table>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
